<!doctype html>
<html lang="en-GB" class="login-form js flexbox svgfilters no-safari no-ie-or-edge no-embedded-ie webp avif">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Local static demo</title>
  <meta name="description" content="Local static UI demonstration. This is not an official University of Warwick sign-in page.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <link rel="stylesheet" href="assets/login/fonts.css">
  <link rel="stylesheet" href="assets/login/sso.css">
  <link rel="stylesheet" href="login.css">
  <script src="auth.js?v=3"></script>
  <script src="login.js?v=2" defer></script>
</head>
<body id="top">
<div class="id7-left-border" aria-hidden="true"></div>
<div class="id7-fixed-width-container">
  <a class="sr-only sr-only-focusable" href="#main">Skip to main content</a>
  <header class="id7-page-header">
    <div class="id7-utility-masthead">
      <nav class="id7-utility-bar" aria-label="Utility bar"></nav>
      <div class="id7-masthead">
        <div class="id7-masthead-contents">
          <div class="clearfix">
            <div class="id7-logo-column">
              <div class="id7-logo-row">
                <div class="id7-logo">
                  <a href="index.html" title="Local Tabula demo homepage">
                    <img src="assets/login/wordmark.svg" alt="University of Warwick">
                  </a>
                </div>
              </div>
            </div>
          </div>
          <div class="id7-header-text clearfix">
            <h1><span class="id7-current-site-link">Sign in » Tabula</span></h1>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="id7-main-content-area" id="main">
    <div class="id7-main-content">
      <noscript><p class="alert alert-warning">Enable JavaScript to use this local sign-in demonstration.</p></noscript>
      <form id="loginform" class="login-box" autocomplete="off">
        <fieldset>
          <div id="login-error" class="alert alert-danger" role="alert" hidden></div>
          <p id="username-summary" class="username-summary" hidden>Signing in as <strong id="selected-username"></strong> <button id="change-username" type="button">Change</button></p>
          <div class="form-group" id="username-group">
            <label for="userName">Username</label>
            <div class="input-group input-group-lg">
              <span class="input-group-addon"><i class="fal fa-fw fa-user" aria-hidden="true"></i></span>
              <input required id="userName" type="text" class="form-control" autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="off" aria-describedby="login-error" autofocus>
            </div>
            <div id="inputHint"></div>
          </div>
          <div class="form-group" id="password-group" hidden>
            <label for="demoPassword">Password</label>
            <div class="input-group input-group-lg">
              <span class="input-group-addon"><i class="fal fa-fw fa-lock" aria-hidden="true"></i></span>
              <input id="demoPassword" type="password" class="form-control" autocomplete="off" aria-describedby="login-error" disabled>
            </div>
          </div>
          <div class="form-group">
            <label class="control-label" aria-hidden="true">&nbsp;</label>
            <button class="btn btn-primary btn-lg btn-block sign-in-button" type="submit" id="signinbutton">Next</button>
          </div>
          <ul class="list-unstyled"><li><a href="https://warwick.ac.uk/aup" target="_blank" rel="noopener noreferrer">Acceptable use policy</a></li></ul>
        </fieldset>
      </form>
    </div>
  </main>
  <footer class="id7-page-footer id7-footer-divider">
    <div class="id7-app-footer">
      <div class="id7-app-footer-content">
        <div class="id7-footer-utility">
          <ul>
            <li><a target="_blank" rel="noopener noreferrer" href="https://warwick.ac.uk/copyright">© MMXXVI</a></li>
            <li><a target="_blank" rel="noopener noreferrer" href="https://warwick.ac.uk/terms">Terms</a></li>
            <li><a target="_blank" rel="noopener noreferrer" href="https://warwick.ac.uk/privacy">Privacy</a></li>
            <li><a target="_blank" rel="noopener noreferrer" href="https://warwick.ac.uk/cookies">Cookies</a></li>
            <li><a target="_blank" rel="noopener noreferrer" href="https://warwick.ac.uk/accessibility">Accessibility</a></li>
            <li><a target="_blank" rel="noopener noreferrer" href="https://warwick.ac.uk/modernslavery">Modern Slavery Statement</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>
</div>
<div class="id7-right-border" aria-hidden="true"></div>
</body>
</html>
